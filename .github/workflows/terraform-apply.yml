name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:

  apply:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    environment:
      name: production

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=blujay/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="mongo_password=${{ secrets.MONGO_PASSWORD }}" \
            -var="ses_verified_email=${{ secrets.SES_FROM_EMAIL }}" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"

      - name: Terraform Outputs
        run: terraform output

      - name: Deployment Summary
        run: |
          echo "## Terraform Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY