name: Terraform Deploy (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true
  # Must match TF_VERSION in terraform-pr.yml -- set once as a repo
  # variable (Settings > Secrets and variables > Actions > Variables)
  # so plan and apply can never run on different Terraform versions.
  TF_VERSION: ${{ vars.TF_VERSION }}

jobs:
  # Refuse to run against anything but main, even if workflow_dispatch
  # is fired manually from another branch.
  guard:
    name: Verify Branch
    runs-on: ubuntu-latest
    steps:
      - name: Fail if not on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Terraform Deploy can only run from main (got ${{ github.ref }})."
            exit 1
          fi

  plan:
    name: Terraform Plan (prod)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=blujay/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            -no-color \
            -detailed-exitcode \
            -out=tfplan \
            -var-file="prod.tfvars" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="mongo_password=${{ secrets.MONGO_PASSWORD }}" \
            -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"
        # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
        # Both 0 and 2 are "success" for our purposes -- only 1 should fail the job.
        continue-on-error: true

      - name: Fail on real plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Generate Human Readable Plan
        run: terraform show -no-color tfplan > plan-prod.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod-apply
          retention-days: 7
          path: |
            tfplan
            plan-prod.txt

      - name: Plan Summary
        run: |
          {
            echo "## 🚀 Production Plan"
            echo ""
            echo "Exit code: ${{ steps.plan.outputs.exitcode }} (0=no changes, 2=changes pending approval)"
            echo '```terraform'
            cat plan-prod.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  apply:
    name: Terraform Apply (prod)
    needs: plan
    if: needs.plan.outputs.plan-exitcode == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This Environment must have "Required reviewers" enabled and
    # "Deployment branches" restricted to main in repo Settings, so a
    # human has to approve the EXACT plan artifact above before it runs.
    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=blujay/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod-apply

      - name: Terraform Apply (exact reviewed plan)
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show Terraform Outputs
        run: terraform output -json

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## ✅ Terraform Deployment Successful"
            echo ""
            echo "**Repository:** ${{ github.repository }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Terraform Outputs"
            echo '```json'
            terraform output -json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed Summary
        if: failure()
        run: |
          {
            echo "## ❌ Terraform Deployment Failed"
            echo ""
            echo "Please review the workflow logs for the failure details."
          } >> $GITHUB_STEP_SUMMARY
