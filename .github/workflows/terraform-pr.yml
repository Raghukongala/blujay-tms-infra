name: Terraform PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true
  # Single source of truth for the Terraform version. Must match the
  # value used in terraform-deploy.yml (repo variable, not hardcoded,
  # so plan and apply can never drift onto different versions).
  TF_VERSION: ${{ vars.TF_VERSION }}

jobs:
  validate:
    name: Format, Validate, Lint, Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend, syntax only)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # Blocking: HIGH/CRITICAL misconfigurations fail the check. Add
      # explicit --skip-check entries here (with a comment explaining why)
      # for any accepted-risk exceptions instead of turning soft_fail back on.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
          check: HIGH,CRITICAL

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL

  plan:
    name: Terraform Plan (${{ matrix.env }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Plans BOTH environments so a reviewer sees the real prod diff on
      # every PR, not just the dev one. Prod plan is read-only here --
      # nothing in this workflow ever applies against prod state.
      matrix:
        env: [dev, prod]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=blujay/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            -no-color \
            -out=tfplan \
            -var-file="${{ matrix.env }}.tfvars" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="mongo_password=${{ secrets.MONGO_PASSWORD }}" \
            -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"

      - name: Generate Human Readable Plan
        if: always()
        run: terraform show -no-color tfplan > plan-${{ matrix.env }}.txt || echo "Terraform plan output not found." > plan-${{ matrix.env }}.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.env }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            tfplan
            plan-${{ matrix.env }}.txt

      - name: Comment Terraform Plan
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_STATUS: ${{ steps.plan.outcome }}
          PLAN_ENV: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');

            let plan = '';
            try {
              plan = fs.readFileSync(`plan-${process.env.PLAN_ENV}.txt`, 'utf8');
            } catch (e) {
              plan = 'Terraform plan output not found.';
            }

            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n...output truncated...';
            }

            const body = [
              `## 🚀 Terraform Plan — ${process.env.PLAN_ENV}`,
              '',
              '**Status:** ' + process.env.PLAN_STATUS,
              '',
              '```terraform',
              plan,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
