name: Terraform PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=blujay/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate -json

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          soft_fail: true

      - name: Setup Infracost
        continue-on-error: true
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost Breakdown
        continue-on-error: true
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json || true

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            -no-color \
            -out=tfplan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="mongo_password=${{ secrets.MONGO_PASSWORD }}" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"

      - name: Generate Human Readable Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          if-no-files-found: ignore
          path: |
            tfplan
            plan.txt
            infracost.json

      - name: Comment Terraform Plan
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_STATUS: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');

            let plan = '';

            try {
              plan = fs.readFileSync('plan.txt', 'utf8');
            } catch (e) {
              plan = 'Terraform plan output not found.';
            }

            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n...output truncated...';
            }

            const body = [
              '## 🚀 Terraform Plan',
              '',
              '**Status:** ' + process.env.PLAN_STATUS,
              '',
              '```terraform',
              plan,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: GitHub Step Summary
        if: always()
        run: |
          {
            echo "## 🚀 Terraform PR Validation"
            echo ""
            echo "| Check | Status |"
            echo "|------|--------|"
            echo "| Terraform Format | ✅ |"
            echo "| Terraform Validate | ✅ |"
            echo "| TFLint | ✅ |"
            echo "| Checkov | Completed |"
            echo "| tfsec | Completed |"
            echo "| Terraform Plan | ${{ steps.plan.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY